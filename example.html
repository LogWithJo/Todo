<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Todo App</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <!-- MAIN TODO APP -->
  <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-6 relative">

    <!-- TOP RIGHT BUTTON -->
    <button id="openDeletedBtn"
      class="absolute top-5 right-5 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-2xl shadow-lg transition flex items-center gap-2">

      <i class="fa-solid fa-trash"></i>
      Deleted Tasks
    </button>

    <h1 class="text-3xl font-bold text-center mb-6">
      📝 My To-Do App
    </h1>

    <!-- INPUT -->
    <div class="flex gap-2 mb-4">
      <input type="text" placeholder="Enter a task..."
        class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400" />

      <button
        class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-3 rounded-xl">
        Add
      </button>
    </div>

    <!-- SEARCH -->
    <div class="mb-5">
      <input type="search" placeholder="Search tasks..."
        class="w-full border rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-400" />
    </div>

    <!-- TASK LIST -->
    <div class="flex flex-col gap-3">

      <!-- TASK -->
      <div
        class="flex items-center justify-between w-full p-4 bg-gray-200/50 rounded-2xl">

        <div class="font-bold capitalize flex-1">
          Learn TypeScript
        </div>

        <div class="flex gap-3 items-center">

          <button
            class="bg-green-600 rounded-full text-white w-10 h-10 flex items-center justify-center">
            <i class="fa-solid fa-check"></i>
          </button>

          <button
            class="bg-red-600 rounded-full text-white w-10 h-10 flex items-center justify-center">
            <i class="fa-solid fa-trash"></i>
          </button>

        </div>
      </div>

    </div>

  </div>

  <!-- FULL WIDTH POPUP -->
  <div id="deletedPopup"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-start justify-center p-6 z-50">

    <!-- POPUP CONTENT -->
    <div
      class="w-full max-w-6xl bg-white rounded-3xl shadow-2xl p-6 mt-10 animate-[fadeIn_.2s_ease]">

      <!-- HEADER -->
      <div class="flex items-center justify-between mb-6">

        <div>
          <h2 class="text-3xl font-bold">
            🗑 Deleted Tasks
          </h2>

          <p class="text-gray-500 mt-1">
            Restore or permanently remove deleted tasks
          </p>
        </div>

        <button id="closeDeletedBtn"
          class="bg-red-500 hover:bg-red-600 text-white w-12 h-12 rounded-full flex items-center justify-center">

          <i class="fa-solid fa-xmark text-lg"></i>

        </button>
      </div>

      <!-- GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">

        <!-- CARD -->
        <div class="bg-gray-200/50 rounded-3xl p-5 flex flex-col gap-4">

          <div class="flex items-center gap-3">

            <div
              class="w-14 h-14 rounded-full bg-red-500 text-white flex items-center justify-center text-xl">
              <i class="fa-solid fa-book"></i>
            </div>

            <div>
              <h3 class="font-bold text-lg capitalize">
                Study French
              </h3>

              <p class="text-sm text-gray-500">
                Deleted 2 mins ago
              </p>
            </div>

          </div>

          <div class="flex gap-3 mt-2">

            <button
              class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-medium">

              Restore

            </button>

            <button
              class="flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-2xl font-medium">

              Delete Forever

            </button>

          </div>

        </div>

        <!-- CARD -->
        <div class="bg-gray-200/50 rounded-3xl p-5 flex flex-col gap-4">

          <div class="flex items-center gap-3">

            <div
              class="w-14 h-14 rounded-full bg-purple-500 text-white flex items-center justify-center text-xl">
              <i class="fa-solid fa-code"></i>
            </div>

            <div>
              <h3 class="font-bold text-lg capitalize">
                Finish React Project
              </h3>

              <p class="text-sm text-gray-500">
                Deleted 10 mins ago
              </p>
            </div>

          </div>

          <div class="flex gap-3 mt-2">

            <button
              class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 rounded-2xl font-medium">

              Restore

            </button>

            <button
              class="flex-1 bg-red-500 hover:bg-red-600 text-white py-3 rounded-2xl font-medium">

              Delete Forever

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  <script>
    const openDeletedBtn = document.getElementById("openDeletedBtn");
    const closeDeletedBtn = document.getElementById("closeDeletedBtn");
    const deletedPopup = document.getElementById("deletedPopup");

    openDeletedBtn.addEventListener("click", () => {
      deletedPopup.classList.remove("hidden");
      deletedPopup.classList.add("flex");
    });

    closeDeletedBtn.addEventListener("click", () => {
      deletedPopup.classList.add("hidden");
      deletedPopup.classList.remove("flex");
    });
  </script>

</body>

</html>
