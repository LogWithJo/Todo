<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Oswald:wght@200..700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/all.min.css">
  <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>

<body class="min-h-screen flex items-center justify-center">

  <div class="w-full max-w-2xl text-white backdrop-blur-xl rounded-2xl shadow-xl p-6 flex flex-col gap-5">

    <!-- <div class="relative flex justify-center items-center">
      <h1 class="text-2xl font-bold text-center mb-4">📝 My To-Do App</h1>
  
          <button type="button" id="openDeletedTasksButton"
        class="bg-red-500 hover:bg-red-600 justify-center justify-self-end text-white px-4 py-2 rounded-2xl shadow-lg transition flex items-center gap-2">
  
        <i class="fa-solid fa-trash"></i>
      </button>
    </div> -->

    <div class="flex items-center w-full relative py-4 px-2">
  
  <!-- left spacer -->
  <div class="flex-1"></div>

  <!-- center title -->
  <h1 class="text-2xl font-bold text-center">
    To-Do App
  </h1>

  <!-- right button -->
  <div class="flex-1 flex justify-end">
    <button
      type="button"
      id="openDeletedTasksButton"
      class="backdrop-blur-3xl cursor-pointer bg-[rgba(255,194,209,0.3)] text-white px-4 py-2 rounded-2xl shadow-lg transition flex items-center gap-2"
    >
      <i class="fa-solid fa-trash"></i>
    </button>
  </div>

</div>


  <div class="grid grid-cols-3 w-full *:shadow-xl *:border-0.5 *:border-white *:w-full *:flex *:flex-col *:justify-center *:items-start">
    <div>
      <div>finished</div>
      <div id="finishedCount">12</div>
    </div>
    <div>
      <div>pending</div>
      <div id="pendingCount">12</div>
    </div>
    <div>
      <div>deleted</div>
      <div id="deletedCount">12</div>
    </div>
  </div>

    <!-- Input -->
    <div class="flex gap-2 justify-center items-center">
      <div class="flex justify-center items-center w-full">
        <input id="newTaskInput" type="text" placeholder="Enter one Word..."
          class="flex w-full rounded-full bg-[rgba(255,194,209,0.3)] p-2 pl-5 placeholder:text-white outline-none " />
      </div>
      <button class="bg-[rgba(255,194,209,0.3)] cursor-pointer border-[rgba(255,255,255,0.18)] border text-white p-3 flex justify-center items-center rounded-full" type="button" id="addTaskButton">
        <i class="fa-solid fa-plus w-full h-full"></i>
      </button>
    </div>

    <div class="flex justify-between items-center">
      <div class="p-3 bg-[rgba(255,194,209,0.3)] *:cursor-pointer rounded-full cursor-pointer">
        <input type="date" name="" id="dueDateInput">
      </div>
  
      <!-- 🔍 Search Input (NEW) -->
      <div class="flex justify-center items-center">
        <input id="searchTaskInput" type="search" placeholder="Search tasks..."
          class="w-full placeholder:text-white bg-[rgba(255,194,209,0.3)] rounded-full p-2 pl-5 outline-none" />
      </div>
    </div>

    <!-- Task List -->
    <div class="flex flex-col gap-3 max-h-[40vh] overflow-y-auto pr-1" id="taskListContainer">
      <!-- Tasks here -->
    </div>
    <div id="emptyTasksMessage" class="hidden w-full h-full flex items-center justify-center py-10 text-center">
  <!-- <h2 class="text-2xl font-bold text-gray-700">No Tasks Found 📝</h2>
  <p class="mt-2 text-gray-500">
    Add your first task to get started.
  </p> -->
  <div class="w-30 h-30 mx-auto flex justify-center items-center">
    <img src="./css/task-completed.png" alt="" class="w-full h-full">
  </div>
</div>

    <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-200">

      <button id="deleteAllButton" type="button" data-type="deleteAll"
        class="px-4 py-2 rounded-xl bg-[rgba(255,194,209,0.3)] border-[rgba(255,255,255,0.18)] border hover:bg-[rgba(256,195,210,0.4)] cursor-pointer text-white font-medium transition active:scale-95">
        Delete All
      </button>

      <button id="deleteCompletedButton" type="button"  data-type="deleteCompleted"
        class="px-4 py-2 rounded-xl bg-[rgba(255,194,209,0.3)] font-medium transition hover:hover:bg-[rgba(256,195,210,0.4)] border-[rgba(255,255,255,0.18)] border  active:scale-95">
        Delete Completed
      </button>

    </div>
  </div>

  <div id="errorMessage"
    class="fixed top-1/6 left-1/2 -translate-y-1/2 -translate-x-1/2 p-2 rounded bg-[rgba(243,234,236,0.3)] hidden capitalize backdrop-blur-3xl font-bold text-white">
  </div>

  <button type="button" id="undoButton" class="fixed bottom-6 left-1/2 z-100 hidden -translate-x-1/2 cursor-pointer
        bg-[rgba(255,194,209,0.3)] shadow-xl rounded-2xl px-5 py-3 flex items-center gap-3
      transition-all duration-300 ease-out border border-gray-200">

    <i class="fa-solid fa-arrow-rotate-left text-white text-lg"></i>

  </button>

<div
  id="deletedTasksPopup"
  class="fixed inset-0 bg-black/40 hidden backdrop-blur-sm max items-start justify-center p-6 z-50"
>

  <!-- POPUP BODY -->
  <div
    id="deletedPopupBody"
    class="w-full max-w-6xl relative flex flex-col max-h-[80vh] gap-6 bg-transparent text-white rounded-3xl shadow-2xl p-6 mt-10 animate-[fadeIn_.2s_ease]"
  >

    <!-- HEADER -->
    <div class="flex items-start justify-between gap-4">

      <div>
        <h2 class="text-3xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-trash text-white"></i>
          Deleted Tasks
        </h2>

        <p class="text-white mt-1">
          Restore or permanently remove deleted tasks
        </p>
      </div>

      <button
        id="closeDeletedPopupButton"
        type="button"
        class="bg-[rgba(255,194,209,0.3)] hover:bg-[rgba(257,196,211,0.5)] cursor-pointer text-white w-12 h-12 rounded-full flex items-center justify-center"
      >
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

    </div>

    <!-- ACTION BAR -->
    <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">

      <!-- SEARCH -->
      <div class="relative w-full lg:max-w-md">
        <input
          type="text"
          id="searchDeletedTasksInput"
          placeholder="Search removed tasks..."
          class="w-full placeholder:text-white bg-[rgba(255,194,209,0.3)] rounded-full p-2 pl-10 outline-none text-white"
        />

        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">

        <button
          type="button"
          id="restoreAllDeletedTasksButton"
          class="px-5 py-3 rounded-2xl cursor-pointer bg-[rgba(255,194,209,0.3)] hover:bg-[rgba(256,197,222,0.5)] text-white font-semibold transition flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-rotate-left"></i>
          Restore All
        </button>

        <button
          type="button"
          id="deleteAllDeletedTasksButton"
          class="px-5 py-3 rounded-2xl cursor-pointer bg-[rgba(255,194,209,0.3)] hover:bg-[rgba(256,197,222,0.5)] text-white font-semibold transition flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-trash"></i>
          Delete All Forever
        </button>

      </div>

    </div>

    <!-- EMPTY STATE -->
<div
  id="noDeletedTasksMessage"
  class="w-full mt-4 flex flex-col items-center justify-center text-center"
>
  <div class="w-16 h-16 rounded-full mx-auto bg-[rgba(255,194,209,0.3)] flex items-center justify-center text-white text-2xl">
    <i class="fa-solid fa-trash-can"></i>
  </div>

  <div class="text-2xl font-bold mt-4">
    No Deleted Tasks 😌
  </div>

  <div class="mt-2 mx-auto max-w-sm">
    You don't have any deleted tasks yet. Everything is safe for now!
  </div>
</div>
    <!-- GRID -->
    <div
      id="deletedTasksContainer"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 max-h-[45vh] overflow-y-auto pr-2"
    >
    </div>

  </div>
</div>

  <script type="module" src="./dist/dom.js"></script>
  <script type="module" src="./dist/data.js"></script>
  <script type="module" src="./dist/ui.js"></script>

  <script type="module" src="./dist/Ddom.js"></script>
  <script type="module" src="./dist/Ddata.js"></script>
  <script type="module" src="./dist/Dui.js"></script>

</body>

</html>
